name: Regression suite

on:
  push:
  pull_request:

env:
  # Codex review on PR #32: REF-9 unified the shard PARTITIONING rule into
  # one function (tests/run_all.sh's select_shard_files()), but this count
  # was still job-level (only on `playwright`, below) while the matrix's
  # own shard list (`shard: [0, 1, 2]`) stayed a second, independent,
  # hand-maintained copy of it -- a third place, on top of run_all.sh's own
  # `${SHARD_COUNT:-3}` default, that had to agree. Confirmed in an
  # isolated check: bumping this to 4 while leaving that list at [0, 1, 2]
  # silently skipped 15 of the 63 test files, with every job still
  # reporting success (each job only knows about the files it ran). Moved
  # to workflow-level `env:` so every job/step inherits it, including the
  # new `compute-shard-matrix` job below, which now GENERATES the matrix
  # list from this one number instead of it being hand-maintained
  # alongside it.
  SHARD_COUNT: 3

jobs:
  # Fast, Playwright-independent checks. Split into its own job (rather
  # than the single job this used to be) so it runs CONCURRENTLY with the
  # Playwright shards below instead of serially before them -- it needs no
  # browser install and finishes in seconds, so there's no reason to make
  # every push wait for it before Playwright even starts.
  unit-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # REF-8 (STATUS.md's "Code quality & refactoring backlog"): `npm ci`,
      # not `npm install` -- installs exactly what relay/package-lock.json
      # pins and fails fast on a lockfile/package.json mismatch, instead of
      # `npm install`'s more permissive dependency-graph resolution
      # silently drifting from what's actually committed. See
      # relay/README.md's own note on when to use which.
      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: Run relay's own protocol tests
        working-directory: relay
        run: npm test

      - name: Run frontend unit tests
        run: node --test tests/unit/test_*.js

  # Generates the playwright job's matrix from the workflow-level
  # SHARD_COUNT above, so bumping that one number is enough on its own --
  # see this workflow's top-level `env:` comment for the exact silent-skip
  # bug this replaces (a hand-maintained matrix list that could quietly
  # fall out of sync with the count).
  compute-shard-matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        run: |
          shards="["
          sep=""
          for ((i = 0; i < SHARD_COUNT; i++)); do
            shards+="$sep$i"
            sep=","
          done
          shards+="]"
          echo "Generated matrix for SHARD_COUNT=$SHARD_COUNT: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  playwright:
    needs: compute-shard-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Generated by compute-shard-matrix above from the workflow-level
        # SHARD_COUNT, not hand-maintained here -- see that job's own
        # comment and this workflow's top-level `env:` comment for why.
        #
        # Splits the tests/test_*.py suite into independent shards, each
        # on its own GitHub-hosted runner (its own CPU, no contention with
        # the other shards) -- and within a shard, tests/run_all.sh runs
        # its files two at a time (see that script's own comment: a
        # standard GitHub-hosted runner has 2 vCPUs, and running more than
        # 2 headless-Chromium workers at once on one was measured to cause
        # a real, reproducible flake in a timing-sensitive relay test
        # under CPU contention -- 2 was the safe number found).
        #
        # Every test file is fully independent by construction -- its own
        # unique build_page()/write_plain_index() output filename, its own
        # hardcoded relay port where it spawns one (verified: no two files
        # in the suite share either) -- so this split is purely a
        # scheduling change with no effect on what runs or what it proves.
        shard: ${{ fromJson(needs.compute-shard-matrix.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Codex review on PR #24: this installed unpinned `pip install
      # playwright`, silently drifting to whatever the latest release was
      # at CI run time (found running 1.63/Chromium 153 against a repo that
      # pins 1.62/Chromium 151 in tests/requirements.txt) -- CI had never
      # actually run the pinned version this whole time, defeating the
      # exact cross-machine-version guarantee tests/README.md documents and
      # docs/DefinitionOfDone.md's Delivery Workflow section already warns
      # about (a real 2026-09-15 incident: two environments investigating
      # the same reported failure were silently running different Chromium
      # builds). Install from the pinned requirements file, like every
      # local run already does.
      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium

      # REF-8: same reasoning as the unit-and-relay job's own identical
      # comment above -- npm ci, not npm install.
      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      # REF-9: SHARD_INDEX hands the actual partitioning decision to
      # tests/run_all.sh's own select_shard_files() -- this used to
      # reimplement the same split independently here as
      # `ls tests/test_*.py | awk 'NR % n == i'`, which (confirmed) picked
      # a DIFFERENT physical file group for "shard 0" than run_all.sh's own
      # 0-indexed shard 0, despite both correctly partitioning the full
      # suite (harmless in effect, but exactly the silent-drift risk this
      # backlog item exists to close). Now there is exactly one
      # implementation of "which files are in shard N," used identically
      # by CI and by a local `tests/run_all.sh` run.
      - name: Run this shard's Playwright files
        env:
          TEST_JOBS: 2
          SHARD_INDEX: ${{ matrix.shard }}
        run: tests/run_all.sh
