name: Regression suite

on:
  push:
  pull_request:

jobs:
  # Fast, Playwright-independent checks. Split into its own job (rather
  # than the single job this used to be) so it runs CONCURRENTLY with the
  # Playwright shards below instead of serially before them -- it needs no
  # browser install and finishes in seconds, so there's no reason to make
  # every push wait for it before Playwright even starts.
  unit-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # REF-8 (STATUS.md's "Code quality & refactoring backlog"): `npm ci`,
      # not `npm install` -- installs exactly what relay/package-lock.json
      # pins and fails fast on a lockfile/package.json mismatch, instead of
      # `npm install`'s more permissive dependency-graph resolution
      # silently drifting from what's actually committed. See
      # relay/README.md's own note on when to use which.
      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: Run relay's own protocol tests
        working-directory: relay
        run: npm test

      - name: Run frontend unit tests
        run: node --test tests/unit/test_*.js

  playwright:
    runs-on: ubuntu-latest
    env:
      # Kept out of `matrix` (rather than a second matrix axis) because
      # GitHub Actions' `${{ }}` expression syntax parses `-` as
      # subtraction -- a `shard-count` matrix key would be misread as
      # `shard - count` wherever it's referenced. A plain job-level env
      # var sidesteps that entirely. Bump this (and extend the `shard`
      # list below to match) if the suite grows enough to want
      # finer-grained sharding later. tests/run_all.sh's own default
      # (no-args) invocation shards locally using the same count and the
      # same split logic, as a local copy of this value, not read from it
      # (no shared source of truth between a workflow file and a bash
      # script) -- if this number changes, check that one too.
      SHARD_COUNT: 3
    strategy:
      fail-fast: false
      matrix:
        # Splits the tests/test_*.py suite into independent shards, each
        # on its own GitHub-hosted runner (its own CPU, no contention with
        # the other shards) -- and within a shard, tests/run_all.sh runs
        # its files two at a time (see that script's own comment: a
        # standard GitHub-hosted runner has 2 vCPUs, and running more than
        # 2 headless-Chromium workers at once on one was measured to cause
        # a real, reproducible flake in a timing-sensitive relay test
        # under CPU contention -- 2 was the safe number found).
        #
        # Every test file is fully independent by construction -- its own
        # unique build_page()/write_plain_index() output filename, its own
        # hardcoded relay port where it spawns one (verified: no two files
        # in the suite share either) -- so this split is purely a
        # scheduling change with no effect on what runs or what it proves.
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Codex review on PR #24: this installed unpinned `pip install
      # playwright`, silently drifting to whatever the latest release was
      # at CI run time (found running 1.63/Chromium 153 against a repo that
      # pins 1.62/Chromium 151 in tests/requirements.txt) -- CI had never
      # actually run the pinned version this whole time, defeating the
      # exact cross-machine-version guarantee tests/README.md documents and
      # docs/DefinitionOfDone.md's Delivery Workflow section already warns
      # about (a real 2026-09-15 incident: two environments investigating
      # the same reported failure were silently running different Chromium
      # builds). Install from the pinned requirements file, like every
      # local run already does.
      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium

      # REF-8: same reasoning as the unit-and-relay job's own identical
      # comment above -- npm ci, not npm install.
      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: Run this shard's Playwright files
        env:
          TEST_JOBS: 2
        run: |
          mapfile -t files < <(ls tests/test_*.py | awk -v n="$SHARD_COUNT" -v i="${{ matrix.shard }}" 'NR % n == i')
          echo "Shard ${{ matrix.shard }}/$SHARD_COUNT running ${#files[@]} file(s):"
          printf '  %s\n' "${files[@]}"
          tests/run_all.sh "${files[@]}"
